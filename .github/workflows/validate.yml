name: Windows validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts, WPF, bridge and time zones
        shell: powershell
        run: |
          & powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\Validate.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
